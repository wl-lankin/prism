# Tests, type checks, formatting and lints on both platforms. The Rust tests run against Prism's
# own minimal FFmpeg (the build in ffmpeg.yml, cached), because many tests decode real files
# through the ffmpeg and ffprobe programs and the installers ship exactly that build.

name: CI

on:
  push:
    branches: [main, PRISM-6]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  test:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            ffmpeg-artifact: ffmpeg-universal-apple-darwin
            exe: ""
          - platform: windows-latest
            ffmpeg-artifact: ffmpeg-x86_64-pc-windows-msvc
            exe: ".exe"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.ffmpeg-artifact }}
          path: ffmpeg-bin

      - name: Point the tests at the built FFmpeg
        shell: bash
        run: |
          chmod +x "ffmpeg-bin/ffmpeg${{ matrix.exe }}" "ffmpeg-bin/ffprobe${{ matrix.exe }}"
          {
            echo "PRISM_FFMPEG=$GITHUB_WORKSPACE/ffmpeg-bin/ffmpeg${{ matrix.exe }}"
            echo "PRISM_FFPROBE=$GITHUB_WORKSPACE/ffmpeg-bin/ffprobe${{ matrix.exe }}"
          } >> "$GITHUB_ENV"
          test -f "ffmpeg-bin/ffmpeg${{ matrix.exe }}"
          test -f "ffmpeg-bin/ffprobe${{ matrix.exe }}"
          "ffmpeg-bin/ffmpeg${{ matrix.exe }}" -version | head -1
          "ffmpeg-bin/ffprobe${{ matrix.exe }}" -version | head -1

      - run: npm ci

      - run: npm test

      - run: npm run check

      # The Rust build embeds the frontend (frontendDist ../dist), so clippy and the tests need it.
      - run: npm run build

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml
