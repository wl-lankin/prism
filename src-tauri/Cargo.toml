[package]
name = "prism"
version = "1.0.0"
description = "Prism - a music player for every source."
authors = ["Wolfgang Linz"]
license = "MIT"
repository = "https://github.com/wl-lankin/prism"
edition = "2021"

[lib]
name = "prism_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rfd = "0.16"
anyhow = "1.0.104"
sha1 = "0.11.0"
hex = "0.4.3"
lofty = "0.25.4"
walkdir = "2.5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rayon = "1.12.0"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "adpcm", "alac", "aiff", "mkv", "caf"] }
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.1"
crossbeam-channel = "0.5.17"
souvlaki = "0.8.3"
window-vibrancy = "0.8.1"

[target.'cfg(windows)'.dependencies]
# DWM attributes for the transparent main window (no border, no rounded system corners, no backdrop).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# No panic = "abort": Prism decodes untrusted media files, and handlers rely on
# unwinding (catch_unwind) to survive a decoder panic instead of killing the app.
strip = true

# Audio decoders are hot loops; keep them fast in dev builds too.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
