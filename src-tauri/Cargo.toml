[package]
name = "prism"
version = "1.0.0"
description = "Prism - a music player for every source."
authors = ["Wolfgang Linz"]
license = "MIT"
repository = "https://github.com/wl-lankin/prism"
edition = "2021"

[lib]
name = "prism_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
anyhow = "1.0.104"
sha1 = "0.11.0"
hex = "0.4.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Audio decoders are hot loops; keep them fast in dev builds too.
[profile.dev.package."*"]
opt-level = 3
